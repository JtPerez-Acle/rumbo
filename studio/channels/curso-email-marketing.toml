# Curso: "Email marketing en 30 días" (e-commerce: flujos, entregabilidad, campañas).
# Del roadmap del design partner: plataformas de email (Klaviyo/Brevo/Mailchimp) son requisito
# de empleo; los flujos son el tema más ejercitable de todo el marketing.
kind = "course"
name = "Email marketing"
slug = "curso-email-marketing"
niche = "Monta el email de tu tienda: flujos automatizados, entregabilidad y campañas que venden"
category = "Marketing y contenido"
audience = "Dueños de tiendas online, encargados de marketing en PyMEs y freelancers hispanohablantes que quieren un canal propio que no dependa del algoritmo"
tone = "Profesora práctica: cada lección deja un flujo, un asunto o una configuración FUNCIONANDO en Brevo o Klaviyo (planes gratuitos). Ejemplos con números reales y honestidad sobre las métricas (la tasa de apertura está rota desde iOS 15)."
cta = "Ahora hazlo tú: la lección continúa en tu ejercicio."
course_brief = "Curso de 30 lecciones (5 módulos de 6) sobre email marketing para e-commerce 2026, para principiantes: elección de plataforma con comparativa honesta (Brevo, Klaviyo, Mailchimp — el curso se hace gratis con Brevo o Klaviyo); captura de lista y consentimiento; entregabilidad (SPF, DKIM, DMARC explicado simple, no caer en spam); los flujos clave con estructura detallada (bienvenida, carrito abandonado, post-compra, winback): cuántos emails, timing y qué dice cada uno; copywriting de asuntos y cuerpos; campañas y calendario; métricas que importan (apertura solo direccional — inflada por Apple Mail) y construcción del baseline propio. Proyecto transversal: dejar el programa de email de una tienda real operativo (la del alumno o una marca real conocida como propuesta profesional). Basado en el material de investigación."
research_file = "email-marketing.md"

