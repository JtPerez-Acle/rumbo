# Curso: "Gestión deportiva en 30 días" (teórico-práctico, sector público y privado).
# Las 15 semillas de ejercicio están encadenadas: al final el alumno tiene un
# proyecto formulado completo y postulable a un fondo real.
kind = "course"
name = "Gestión deportiva"
slug = "curso-gestion-deportiva"
niche = "De un club real a un proyecto formulado y postulable: diagnóstico, presupuesto, marco lógico y patrocinio"
category = "Deporte"
audience = "Dirigentes de clubes, gestores deportivos municipales, funcionarios de institutos y federaciones, y profesionales del deporte privado en LatAm que necesitan planificar, administrar y postular a fondos"
tone = "Consultor que ha formulado proyectos y leído bases de fondos concursables: concreto, con números y plazos reales, alérgico a la motivación genérica. Cada lección deja un documento que sirve."
cta = "Ahora hazlo tú: la lección continúa en tu ejercicio."
course_brief = "Curso de 30 lecciones (5 módulos de 6) de gestión deportiva con enfoque teórico-práctico para LatAm. Progresión: (1) el sistema deportivo — los tres circuitos, arquitectura institucional comparada (Chile, Colombia, México, Argentina, Perú), quién financia qué, deporte escolar y municipal como eslabones débiles; (2) planificación y estrategia — diagnóstico de 5 dimensiones, objetivos formato qué-quién-cuánto-cuándo, indicadores de gestión, cuadro de mando adaptado al deporte; (3) administración y gobernanza — presupuesto y estructura de costos reales por partidas, recursos humanos y voluntariado, instalaciones, compliance e integridad post-reformas FIFA/COI, transparencia; (4) formulación de proyectos como corazón práctico — árbol de problemas, árbol de objetivos, matriz de marco lógico completa, presupuesto, cronograma con hitos, evaluación ex-ante; (5) aplicación sectorial — modelos de negocio, patrocinio y su valorización, gestión de eventos, deporte para el desarrollo, y evaluación de casos reales de éxito Y de fracaso. Enseñar que un programa presupuestado no es un programa ejecutado: el gestor monitorea ejecución, no solo asignación. PROYECTO TRANSVERSAL OBLIGATORIO: en la lección 1 el alumno elige UNA organización deportiva real (su club, su municipio, una federación que conozca) y la mantiene todo el curso; las tareas están encadenadas y cada artefacto alimenta el siguiente, de modo que al terminar tiene un expediente completo: ficha de posicionamiento, diagnóstico, objetivos y KPIs, presupuesto por partidas, matriz de marco lógico, cronograma, propuesta de patrocinio valorizada y revisión de admisibilidad. Todo dato económico con moneda, año y fuente; los fondos concursables cambian bases cada año, así que el curso enseña el hábito de leer las bases vigentes. Basado en el material de investigación."
