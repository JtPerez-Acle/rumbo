    let active=0; CV_STAGES.forEach(([at],i)=>{ if(el>=at)active=i; });
    card.querySelectorAll('.jstage').forEach(s=>{ const i=+s.dataset.i;
      s.classList.toggle('done', done||i<active); s.classList.toggle('now', !done&&i===active); });
  };
  paint(); const tick=setInterval(paint,1000);
  const {res,data}=await postWithTimeout('/api/learn/cv',{cv,company:honeypot||''},CV_TIMEOUT_MS);
  done=true; clearInterval(tick); paint();
  if(!res||!res.ok){
    // The CV is still in the draft, so "intentar de nuevo" reopens it filled in.
    return renderCvBox((data&&data.detail)||'No pudimos leer tu CV. Vuelve a intentarlo en unos minutos.');
  }
  clearDraft('cv',0);
  renderCvResult(data);
}

async function cvCourse(slug){
  if(!_cvCourses[slug])_cvCourses[slug]=await api('/course/'+slug);
  return _cvCourses[slug];
}

function renderCvResult(data){
  if(data.pass_score)CV_PASS=data.pass_score;
  app.innerHTML='';
  const back=$(`<div class="back">‹ Mi objetivo</div>`); back.onclick=()=>nav('#/objetivo'); app.append(back);
  const claims=data.claims||[];
  const strong=claims.filter(c=>c.proposed);
  const weak=claims.filter(c=>!c.proposed);
  const taken=claims.filter(c=>c.state!=='pendiente');
  app.append($(`<div style="margin-top:6px"><div class="eyebrow">Lo que ya traes</div>
    <h1 style="margin-top:10px">${esc(data.headline||'Leímos tu CV')}</h1>
    <p class="muted" style="margin-top:8px">${strong.length
      ? `Encontramos <b>${strong.length} módulo${strong.length>1?'s':''}</b> de nuestro catálogo que tu CV muestra que ya hiciste — ${data.proposed_lessons} lecciones. Decide tú qué hacer con cada uno.`
      : 'No encontramos módulos que tu CV demuestre haber hecho. Eso no dice nada malo de tu experiencia: solo significa que no podemos citarla, y sin cita no damos nada por sabido.'}</p></div>`));

  if(strong.length){
    app.append($(`<div class="microlabel" style="margin-top:18px">Tú decides</div>`));
    strong.forEach(c=>app.append(cvClaimCard(c)));
  }
  if(weak.length){
    app.append($(`<div class="microlabel" style="margin-top:18px">Lo leímos, pero no alcanza para saltártelo</div>`));
    const w=$(`<div class="card"></div>`);
    weak.forEach(c=>w.append($(`<div class="gaprow"><span class="gx">${I('alert','ic ic-s')}</span>
      <span>${esc(c.course_title)} · módulo ${c.module_no} — <span class="faint">${esc(c.capability||'')}</span></span></div>`)));
    w.append($(`<p class="faint t-sm" style="margin:10px 2px 0">Mencionar algo no es lo mismo que haberlo hecho. Si crees que sí lo dominas, entra al módulo y prueba su reto: se acredita solo.</p>`));
    app.append(w);
  }
  if((data.fuera_del_catalogo||[]).length){
    app.append($(`<div class="microlabel" style="margin-top:18px">Esto traes y no lo enseñamos</div>`));
    const g=$(`<div class="card"></div>`);
    data.fuera_del_catalogo.forEach(x=>g.append($(`<div class="gaprow"><span class="gx">${I('check','ic ic-s')}</span>
      <span>${esc(x.name)}</span></div>`)));
    g.append($(`<p class="faint t-sm" style="margin:10px 2px 0">Si tu objetivo pide algo de esta lista, ya lo tienes: cuéntalo en la entrevista.</p>`));
    app.append(g);
  }

  const foot=$(`<div style="margin-top:22px">
    <p class="faint t-sm">Leído el ${esc(data.created_at||'')}. Tu CV no aparece en tu documento ni en ninguna página pública — ahí solo va trabajo tuyo evaluado.</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
      <button class="btn btn-ghost" id="cvre">Pegar otro CV</button>
      <button class="btn btn-ghost" id="cvdel">Borrar mi CV</button></div>
    <div id="cvfmsg" class="center muted t-sm" style="margin-top:8px"></div></div>`);
  app.append(foot);
  foot.querySelector('#cvre').onclick=()=>renderCvBox();
  foot.querySelector('#cvdel').onclick=async()=>{
    const z=foot.querySelector('#cvfmsg'); z.textContent='Borrando…';
    const r=await api('/cv',{method:'DELETE'});
    if(r&&r.ok){
      z.textContent='';
      app.innerHTML='';
      app.append($(`<div style="margin-top:14px"><div class="eyebrow">Tu experiencia</div>
        <h1 style="margin-top:10px">Listo, lo borramos.</h1>
        <p class="muted" style="margin-top:8px">${taken.filter(c=>c.state==='acreditado').length
          ? 'Los módulos que acreditaste con su reto siguen acreditados: eso lo probaste tú, no lo dijo tu CV.'
          : 'Los módulos que te habías saltado vuelven a tu ruta.'}</p></div>`));
      const b=$(`<button class="btn btn-primary" style="margin-top:14px">Volver a mi objetivo</button>`);
      b.onclick=()=>nav('#/objetivo'); app.append(b);
    }else z.textContent='No pudimos borrarlo, intenta de nuevo.';
  };
}

function cvClaimCard(c){
  const done=c.state==='acreditado', skipped=c.state==='declarado';
  const card=$(`<div class="card" style="${done?'border-color:var(--amber)':''}">
    <div class="row" style="justify-content:space-between;align-items:flex-start;gap:10px">
      <span class="microlabel">${esc(c.course_title)} · módulo ${c.module_no}</span>
      ${done?`<span class="pill go">Acreditado ${c.exempt_score||''}</span>`
        :skipped?`<span class="pill soon">Te lo saltas</span>`:''}</div>
    <p class="t-base" style="font-weight:600;margin:8px 0 4px">${esc(c.outcome||c.module_title||'')}</p>
    <p class="faint t-sm" style="margin:0 0 8px">Lo decimos por esto que escribiste: “${esc(c.evidence||'')}”</p>
    <div class="cvacts" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="cvmsg center muted t-sm" style="margin-top:6px"></div></div>`);
  const acts=card.querySelector('.cvacts'), msg=card.querySelector('.cvmsg');
  const act=async(action)=>{
    acts.querySelectorAll('button').forEach(b=>b.disabled=true);
    const r=await api('/exemption',{method:'POST',body:JSON.stringify(
      {course_slug:c.course_slug,module_no:c.module_no,action,claim:c.capability||''})});
    if(r&&r.ok){ c.state=action==='skip'?'declarado':'pendiente'; card.replaceWith(cvClaimCard(c)); }
    else { msg.textContent=(r&&r.detail)||'No pudimos guardarlo.';
           acts.querySelectorAll('button').forEach(b=>b.disabled=false); }
  };
  if(done){
    acts.append($(`<p class="faint t-sm" style="margin:0">Pasaste su reto. El módulo sigue abierto si alguna vez quieres verlo.</p>`));
    const see=$(`<button class="btn btn-ghost">Ver el módulo</button>`);
    see.onclick=()=>nav('#/curso/'+c.course_slug); acts.append(see);
    return card;
  }
  if(skipped){
    const probar=$(`<button class="btn btn-primary">${I('target','ic ic-s')} Pruébalo con el reto</button>`);
    probar.onclick=async()=>{
      msg.textContent='Buscando su reto…';
      const o=await cvCourse(c.course_slug);
      const m=((o&&o.modules)||[]).find(x=>x.module_no===c.module_no);
      if(m&&m.capstone&&m.capstone.id)nav('#/reto/'+m.capstone.id);
      else msg.textContent='Ese módulo todavía no tiene reto. Puedes verlo desde el temario.';
    };
    const undo=$(`<button class="btn btn-ghost">Mejor enséñamelo</button>`);
    undo.onclick=()=>act('teach');
    acts.append(probar); acts.append(undo);
    acts.append($(`<p class="faint t-sm" style="margin:2px 0 0">El reto es un caso nuevo que las lecciones no cubren. Si lo sacas ${CV_PASS}+ queda acreditado con tu trabajo, y ese trabajo cuenta para tu documento.</p>`));
    return card;
  }
  const skip=$(`<button class="btn btn-primary">Ya lo sé, sáltalo</button>`);
  skip.onclick=()=>act('skip');
  const keep=$(`<button class="btn btn-ghost">Prefiero verlo igual</button>`);
  keep.onclick=()=>{ card.querySelector('.cvmsg').textContent='Listo: se queda en tu ruta.'; };
  acts.append(skip); acts.append(keep);
  return card;
}

/* ---------- Mi objetivo: the route as the learner's spine (docs/09) ---------- */
async function viewObjetivo(){
  const jt=await api('/job-target'); if(jt.__unauth)return toLogin();
  app.innerHTML='';
  const back=$(`<div class="back">‹ Hoy</div>`); back.onclick=()=>nav('#/hoy'); app.append(back);
  if(!jt.exists){
    app.append($(`<div style="margin-top:14px"><div class="eyebrow">Tu objetivo</div>
      <h1 style="margin-top:10px">Aún no tienes un objetivo activo.</h1>
      <p class="muted" style="margin-top:8px">Pega la oferta del trabajo que quieres y armamos tu ruta de estudio y el documento para la entrevista.</p></div>`));
    const go=$(`<button class="btn btn-primary" style="margin-top:14px">Pega tu oferta ${I('arrow','ic ic-s')}</button>`);
    go.onclick=()=>nav('#/oferta'); app.append(go); return;
  }
  app.append($(`<div style="margin-top:6px"><div class="eyebrow">Tu objetivo</div>
    <h1 style="margin-top:10px">${esc(jt.role_title||'Tu próximo trabajo')}</h1>
    ${jt.company?`<p class="muted t-sm" style="margin-top:6px">${esc(jt.company)}</p>`:''}
    ${jt.exempt_lessons?`<p class="muted t-sm" style="margin-top:8px">Te saltaste <b>${jt.exempt_modules} módulo${jt.exempt_modules>1?'s':''}</b> que ya sabías: te quedan <b>${jt.remaining} lecciones</b> en vez de ${jt.total-jt.done}.</p>`:''}</div>`));
  if(jt.next_lesson){
    const nx=$(`<div class="card-hero" style="margin-top:12px">
      <div class="eyebrow">Siguiente paso de tu ruta</div>
      <p class="muted t-sm" style="margin:8px 0 4px">${esc(jt.next_lesson.course_title)}</p>
      <h3 style="margin-bottom:12px">${esc(jt.next_lesson.title)}</h3>
      <button class="btn btn-primary">${I('play','ic ic-s')} Continuar mi ruta</button></div>`);
    nx.querySelector('button').onclick=()=>nav('#/leccion/'+jt.next_lesson.node_id);
    app.append(nx);
  }
  /* THE SPINE. This used to render one card per COURSE with a module range —
     a bill of materials. docs/09 settled that the module is the unit and the
     matcher has reasoned in modules since; only the screen still sold courses.
     Now it is an ordered path of steps, each labelled by what you will be able
     to DO, with the course demoted to provenance. */
  const steps=jt.steps||[];
  const firstPending=steps.findIndex(s=>s.done<s.lessons&&!s.exempt);
  const phases=[['nucleo','Empieza por aquí'],['despues','Después, para completar el perfil']];
  let stepNo=0;
  phases.forEach(([ph,label])=>{
    const rows=steps.filter(s=>s.phase===ph);
    if(!rows.length)return;
    app.append($(`<div class="microlabel" style="margin-top:16px">${label}</div>`));
    rows.forEach(st=>{
      const idx=steps.indexOf(st); stepNo++;
      const complete=st.done>=st.lessons;
      const current=idx===firstPending;
      const pct=st.lessons?Math.round(100*st.done/st.lessons):0;
      /* docs/10: a skipped module stays in the route — the job still needs it —
         and its lessons stay open. It just is not where we start anyone. */
      const mark=complete||st.exempt?I('check','ic ic-s'):current?I('play','ic ic-s'):I('lock','ic ic-s');
      const card=$(`<div class="card ${st.next_lesson_id?'clickable':''}"
          style="${current?'border-color:var(--amber)':''}${st.exempt?';opacity:.72':''}">
        <div class="row" style="justify-content:space-between;align-items:flex-start;gap:10px">
          <div class="row" style="gap:8px;align-items:center">
            <span style="color:${complete||st.exempt?'var(--amber)':'var(--faint)'}">${mark}</span>
            <span class="microlabel">Paso ${stepNo} de ${steps.length}</span></div>
          ${st.exempt==='acreditado'?`<span class="pill go">Acreditado ${st.exempt_score||''}</span>`
            :st.exempt?`<span class="pill soon">Ya lo sabes</span>`
            :`<span class="muted t-sm">${st.done}/${st.lessons}</span>`}</div>
        <p class="t-base" style="font-weight:600;margin:8px 0 4px">${esc(st.outcome||st.module_title||'')}</p>
        <p class="faint" style="font-size:var(--fs-xs);margin:0 0 8px">${esc(st.course_title)} · módulo ${st.module_no}</p>
        <div class="prog"><i style="width:${pct}%"></i></div></div>`);
      if(st.next_lesson_id)card.onclick=()=>nav('#/leccion/'+st.next_lesson_id);
      else if(complete)card.onclick=()=>nav('#/curso/'+st.course_slug);
      app.append(card);
    });
  });
  /* docs/10. Offered AFTER the route, on purpose: the objection this answers
     ("son muchísimas lecciones, la mitad ya la sé") only exists once they have
     seen the length. Before the route it is a form; after it, it is a fix. */
  const cvs=await api('/cv');
  app.append($(`<div class="microlabel" style="margin-top:18px">Lo que ya sabes</div>`));
  const cvcard=$(`<div class="card clickable">
    <div class="row" style="gap:8px">${I('doc','ic ic-s')}<b class="t-md">${cvs.exists?'Tu CV, leído':'¿Ya sabes parte de esto?'}</b></div>
    <p class="t-sm muted" style="margin-top:8px">${cvs.exists
      ? `Encontramos ${cvs.proposed_modules} módulo${cvs.proposed_modules===1?'':'s'} que tu CV muestra que ya hiciste.${jt.exempt_modules?'':' Todavía no te saltaste ninguno.'}`
      : 'Pega tu CV y te decimos qué módulos de esta ruta ya hiciste en tu trabajo. Tú decides cuáles saltarte — y puedes acreditarlos con su reto.'}</p></div>`);
  cvcard.onclick=()=>nav('#/cv'); app.append(cvcard);
  if(jt.gaps&&jt.gaps.length){
    app.append($(`<div class="microlabel" style="margin-top:16px">Esto lo pide el puesto y no lo cubrimos</div>`));
    const g=$(`<div class="card"></div>`);
    jt.gaps.forEach(x=>g.append($(`<div class="gaprow"><span class="gx">${I('alert','ic ic-s')}</span><span>${esc(x.name)}</span></div>`)));
    app.append(g);
  }
  // The goal document: compiles the learner's best work across the WHOLE route,
  // aimed at this posting. Eligible from the first submission — it grows.
  const gd=await api('/goal-doc');
  app.append($(`<div class="microlabel" style="margin-top:16px">Tu documento para la entrevista</div>`));
  const dcard=$(`<div class="card card-paper">
    <div class="row" style="gap:8px">${I('doc','ic ic-s')}<b class="t-md">${esc(jt.doc_type||'Documento profesional')}</b></div>
    <p class="t-sm" style="margin-top:8px;opacity:.85">${gd.exists
      ?'Compilado con tu trabajo real. Se actualiza cada vez que lo regeneres.'
      :gd.eligible
        ?'Ya tienes trabajo suficiente: compila tu primera versión.'
        :`Se arma con tu trabajo real: llevas <b>${gd.submissions||0} de ${gd.needed||3}</b> entregas de los cursos de tu ruta. Con menos tendría que inventar, y este documento lo vas a mostrar. No es un CV — es el trabajo que hiciste, con tus decisiones y tus números.`}</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
      ${gd.eligible?`<button class="btn btn-paper" id="gdo">${gd.exists?'Actualizar mi documento':'Compilar mi documento'}</button>`:''}
      ${gd.exists?`<button class="btn btn-ghost" id="gview">Ver y compartir</button>`:''}</div>
    <div id="gmsg" class="center muted t-sm" style="margin-top:8px"></div></div>`);
  app.append(dcard);
  const gdo=dcard.querySelector('#gdo');
  if(gdo)gdo.onclick=async()=>{
    gdo.disabled=true; const zone=dcard.querySelector('#gmsg');
    const rc=readingCard('Tu tutora está compilando tu documento…'); dcard.append(rc);
    const res=await api('/goal-doc',{method:'POST'});
    rc.remove(); gdo.disabled=false;
    if(res&&res.share_url){window.open(res.share_url,'_blank'); viewObjetivo();}
    else zone.textContent=(res&&res.detail)||'No pudimos compilarlo, intenta de nuevo.';
  };
  const gv=dcard.querySelector('#gview');
  if(gv)gv.onclick=()=>window.open(gd.share_url,'_blank');

  // Changing goal is normal, not an edge case: people find new offers. It is
  // also non-destructive — completed lessons carry over and the old goal keeps
  // its document — so the entry point can be plainly visible.
  app.append($(`<div class="microlabel" style="margin-top:18px">¿Encontraste otra oferta?</div>`));
  const other=$(`<button class="btn btn-ghost">Analizar otra oferta ${I('arrow','ic ic-s')}</button>`);
  other.onclick=()=>nav('#/oferta'); app.append(other);
  app.append($(`<p class="faint t-sm" style="margin:8px 2px 0">Tu avance no se pierde: las lecciones que ya hiciste cuentan para cualquier ruta que las incluya, y este objetivo queda guardado con su documento.</p>`));

  const hist=await api('/job-targets');
  const others=((hist&&hist.targets)||[]).filter(t=>!t.active);
  if(others.length){
    app.append($(`<div class="microlabel" style="margin-top:16px">Tus otros objetivos</div>`));
    others.forEach(t=>{
      const row=$(`<div class="lrow clickable"><div class="num">${I('target','ic ic-s')}</div>
        <div class="lt">${esc(t.role_title||'Objetivo')}
          <div style="font-size:var(--fs-xs);color:var(--faint);font-weight:600;margin-top:2px">${t.done}/${t.total} lecciones · ${t.coverage}% cubierto${t.has_doc?' · tiene documento':''}</div></div>
        <div class="st">Retomar</div></div>`);
      row.onclick=async()=>{
        const r=await api('/job-target/claim',{method:'POST',body:JSON.stringify({token:t.token})});
        if(r&&r.ok)viewObjetivo();
      };
      app.append(row);
    });
  }
}

/* ---------- Hoy: the zero-decision daily entry ---------- */
async function viewToday(){
  const [d,jt]=await Promise.all([api('/today'),api('/job-target')]);
  STATE.objetivo=jt;   // the continue-card measures the route, not the course
  if(d.__unauth)return toLogin();
  app.innerHTML='';
  app.append($(`<div class="topbar"><div class="brandrow"><div class="brandmark"></div><div class="brandname">Rumbo<small>Hola, ${esc(d.name)}</small></div></div>${flameChip(d.streak)}</div>`));
  // The goal is the spine of the experience (docs/09): if there is an active
  // job target, the day starts from it, not from a loose course.
  if(jt&&jt.exists){
    const pct=jt.total?Math.round(100*jt.done/jt.total):0;
    const card=$(`<div class="card card-spot" style="margin-top:6px">
      <div class="eyebrow">Tu objetivo</div>
      <h2 style="margin-top:6px">${esc(jt.role_title||'Tu próximo trabajo')}</h2>
      <div class="row" style="justify-content:space-between;margin:10px 0 6px">
        <span class="muted t-sm">${jt.done} de ${jt.total} lecciones de tu ruta</span>
        <span class="muted t-sm">${pct}%</span></div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <button class="btn btn-ghost" style="margin-top:12px">Ver mi ruta y mi documento ${I('arrow','ic ic-s')}</button></div>`);
    card.querySelector('button').onclick=()=>nav('#/objetivo');
    app.append(card);
  }else if(STATE.me&&!STATE.me.project_name){
    /* Aplicación is 40 of the 100 points and is judged against this. Skipped by
       every learner so far, because the old nudge sounded like a nicety. Say
       what it actually costs. */
    const nud=$(`<div class="lrow clickable" style="margin-top:6px"><div class="num">${I('target','ic ic-s')}</div>
      <div class="lt">Elige tu proyecto real<div style="font-size:var(--fs-xs);color:var(--faint);font-weight:600;margin-top:2px">Sin él tu tutora evalúa a ciegas: 40 de los 100 puntos miden qué tan anclado está tu trabajo en un proyecto tuyo</div></div>
      <div class="st">Definir</div></div>`);
    nud.onclick=()=>nav('#/perfil'); app.append(nud);
  }
  if(d.continue&&!d.continue.finished){
    const c=d.continue;
    /* With a goal set, the headline is the GOAL and the measure is the route —
       "Paso 4 de 24 hacia Growth Marketer". Saying "Lección 4 de 30 de Marketing
       con IA" frames the work as consuming a course, which is exactly the
       shop-shaped reading the route exists to replace. Without a goal we fall
       back to the course framing, because then the course really is the unit. */
    /* "Paso" means a MODULE step (#/objetivo counts 13 of them). Here we are
       pointing at one lesson, so it counts lessons within the route — using the
       same word for both units with different denominators reads as a bug. */
    const goal=STATE.objetivo;
    const onRoute=goal&&goal.exists&&goal.total>0;
    const step=onRoute?Math.min(goal.done+1,goal.total):null;
    const card=$(`<div class="card-hero" style="margin-top:6px">
      <div class="eyebrow">${onRoute?'Tu ruta hacia '+esc(goal.role_title||'tu objetivo'):'Continúa donde quedaste'}</div>
      <h2 style="margin-top:8px">${esc(c.lesson_title)}</h2>
      <p class="muted t-sm" style="margin:6px 0 14px">${onRoute
        ? `Lección ${step} de ${goal.total} de tu ruta · ${esc(c.course_title)}`
        : `Lección ${c.position} de ${c.total} · ${esc(c.course_title)}`}</p>
      ${onRoute?`<div class="prog" style="margin-bottom:12px"><i style="width:${Math.round(100*goal.done/goal.total)}%"></i></div>`:''}
      <button class="btn btn-primary">${I('play','ic ic-s')} ${d.done_today>0?'Sigue con tu clase':'Empieza tu clase de hoy'}</button></div>`);
    card.querySelector('button').onclick=()=>nav('#/leccion/'+c.lesson_id);
    app.append(card);
  }else if(d.continue&&d.continue.finished){
    const card=$(`<div class="card-hero" style="margin-top:6px">
      <div class="eyebrow">Curso completado</div>
      <h2 style="margin-top:8px">${esc(d.continue.course_title)}</h2>
      <p class="muted t-sm" style="margin:6px 0 14px">Compila tu documento final y elige tu próximo curso.</p>
      <button class="btn btn-primary">Elegir mi próximo curso ${I('arrow','ic ic-s')}</button></div>`);
    card.querySelector('button').onclick=()=>nav('#/cursos');
    app.append(card);
  }else{
    /* A learner with no goal used to land on "elige tu primer curso" — the
       opposite of what the landing promised them ("dinos qué quieres ser,
       nosotros armamos el plan"). Choosing blind from 14 courses is exactly what
       the route exists to prevent, and the one real learner did lesson 1 of two
       unrelated courses and stopped. Lead with the goal; keep browsing as the
       secondary door for people who already know what they want. */

    const alt=$(`<div class="lrow clickable" style="margin-top:6px"><div class="num">${I('book','ic ic-s')}</div>

      <div class="st">Cursos</div></div>`);
    alt.onclick=()=>nav('#/cursos'); app.append(alt);
  }
  if(d.reviews&&d.reviews.length){
    app.append($(`<div class="microlabel" style="margin-top:10px">Repasos de hoy · fijan lo aprendido</div>`));
    d.reviews.forEach(r=>{
      const row=$(`<div class="lrow clickable"><div class="num">${I('redo','ic ic-s')}</div>
        <div class="lt">${esc(r.lesson_title)}<div style="font-size:var(--fs-xs);color:var(--faint);font-weight:600;margin-top:2px">${esc(r.course_title)}</div></div>
        <div class="st">Repasar</div></div>`);
      row.onclick=()=>nav('#/leccion/'+r.lesson_id); app.append(row);
    });
  }
  if(d.defenses&&d.defenses.length){
    app.append($(`<div class="microlabel" style="margin-top:10px">Tu tutora te hizo una pregunta · suma hasta 10 pts</div>`));
    d.defenses.forEach(f=>{
      const row=$(`<div class="lrow clickable caprow"><div class="num">${I('mic','ic ic-s')}</div>
        <div class="lt">${esc(f.lesson_title)}</div><div class="st">Responder</div></div>`);
      row.onclick=()=>nav(f.kind==='capstone'
        ? '#/reto/'+f.capstone_id
        : '#/leccion/'+f.lesson_id+'/'+f.step);
      app.append(row);

  if(d.done_today>0)app.append($(`<p class="faint t-sm center" style="margin-top:14px">Hoy: ${d.done_today} ${d.done_today===1?'lección completada':'lecciones completadas'} ✓</p>`));
}

async function viewCatalog(){

    if(c.available){
      const card=$(`<div class="card course-card">
        <div class="pill go" style="position:absolute;top:14px;right:14px">${c.done>0?pct+'%':'Empezar'}</div>
        <h3>${esc(c.title)}</h3>
        ${c.description?`<p class="desc">${esc(c.description)}</p>`:''}
        ${c.doc_type?`<p class="delivers">${I('doc','ic ic-s')} Termina con: ${esc(c.doc_type)}</p>`:''}
        <div class="prog"><i style="width:${pct}%"></i></div>
        <div class="meta"><span>${c.done} de ${c.total} lecciones · ${c.modules} módulos</span>${I('arrow','ic ic-s')}</div></div>`);
      card.onclick=()=>nav('#/curso/'+c.slug); return card;
    }
    return $(`<div class="card course-card soon">
      <div class="pill soon" style="position:absolute;top:14px;right:14px">Próximamente</div>
      <h3>${esc(c.title)}</h3>
      ${c.description?`<p class="desc">${esc(c.description)}</p>`:''}
      ${c.doc_type?`<p class="delivers">${I('doc','ic ic-s')} Termina con: ${esc(c.doc_type)}</p>`:''}
      <div class="meta"><span>${c.total} lecciones · ${c.modules} módulos · en producción</span></div></div>`);
  };
  const cats=clusterize(d.courses);
  // Open the cluster where the learner is working; otherwise the first one.
  const active=d.courses.find(c=>c.done>0);
  const openCat=active?(active.category||'Más cursos'):(cats[0]?cats[0][0]:null);
  renderClusters(cats, openCat, courseCard);

}

async function viewOutline(slug){
  const d=await api('/course/'+slug); if(d.__unauth)return toLogin();

  const back=$(`<div class="back">‹ Cursos</div>`); back.onclick=()=>nav('#/cursos'); app.append(back);
  const pct=d.total?Math.round(d.done/d.total*100):0;
  app.append($(`<div><h2>${esc(d.title)}</h2>
    ${d.description?`<p class="muted t-sm" style="margin-top:8px">${esc(d.description)}</p>`:''}
    <div class="row" style="justify-content:space-between;margin:12px 0 8px"><span class="microlabel">Tu avance</span><span class="microlabel">${d.done}/${d.total} · ${pct}%</span></div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <p class="faint" style="font-size:var(--fs-xs);margin-top:8px">Toca cualquier lección bloqueada para ver qué aprenderás en ella.</p></div>`));
  d.modules.forEach(m=>{
    /* docs/10: a skipped module is COLLAPSED, never removed and never locked.
       The ask was "no me hagas ver de nuevo lo que ya sé", and a list of six
       lessons they told us they already know is exactly that — but hiding it
       for good would be the other failure, so it stays one tap away. */
    app.append($(`<div class="modhead">Módulo ${m.module_no} · ${esc(m.module_title)}
      ${m.exempt==='acreditado'?`<span class="pill go" style="margin-left:8px">Acreditado ${m.exempt_score||''}</span>`
        :m.exempt?`<span class="pill soon" style="margin-left:8px">Ya lo sabes</span>`:''}</div>`));
    if(m.module_description)app.append($(`<p class="muted t-sm" style="margin:-2px 0 10px">${esc(m.module_description)}</p>`));
    const holder=m.exempt?$(`<div class="modskip hide"></div>`):app;
    if(m.exempt){
      const toggle=$(`<div class="lrow clickable" style="opacity:.75">
        <div class="num">${I('check','ic ic-s')}</div>
        <div class="lt">${m.exempt==='acreditado'
          ? 'Lo acreditaste con su reto'
          : 'Te saltaste este módulo'}</div>
        <div class="st">Ver igual</div></div>`);
      toggle.onclick=()=>holder.classList.toggle('hide');
      app.append(toggle); app.append(holder);
    }
    m.lessons.forEach(l=>{
      const clickable=l.status==='done'||l.status==='current';
      const stLabel={done:'Completada',current:'Disponible',coming:'En producción',locked:'Bloqueada'}[l.status];
      const mark=l.status==='done'?I('check','ic ic-s'):l.status==='locked'?I('lock','ic ic-s'):l.status==='coming'?I('clock','ic ic-s'):l.position;
      const row=$(`<div class="lrow ${l.status} ${clickable?'clickable':''}" ${l.objectives?`style="flex-wrap:wrap"`:''}>
        <div class="num">${mark}</div><div class="lt">${esc(l.title)}</div><div class="st">${stLabel}</div>
        ${l.objectives?`<div class="obj hide">Al terminar podrás: ${esc(l.objectives)}</div>`:''}</div>`);
      if(clickable)row.onclick=()=>nav('#/leccion/'+l.id);
      else if(l.objectives)row.onclick=()=>row.querySelector('.obj').classList.toggle('hide');
      holder.append(row);
    });
    if(m.capstone){
      const c=m.capstone;
      const stLabel=c.status==='done'?(c.score!=null?c.score+'/100':'Completado')
        :c.test_out?'Pruébalo':c.status==='available'?'Disponible':'Bloqueado';
      const capTitle=(c.title||'').replace(/^reto:?\s*/i,'');
      const row=$(`<div class="lrow caprow ${c.status==='locked'?'locked':'clickable'}"
          ${c.test_out?'style="border-color:var(--amber)"':''}>
        <div class="num">${I('flag','ic ic-s')}</div>
        <div class="lt">${c.test_out?'Acredita este módulo: ':'Reto: '}${esc(capTitle)}</div>
        <div class="st">${stLabel}</div></div>`);
      if(c.status!=='locked')row.onclick=()=>nav('#/reto/'+c.id);
      app.append(row);
    }
  });
  renderCaseStudyCard(slug);
}

/* ---------- portfolio: project document (primary) + case study (companion) ---------- */
async function renderCaseStudyCard(slug){
  const [doc,cs]=await Promise.all([api('/project-doc/'+slug),api('/case-study/'+slug)]);
  if(doc.__unauth||doc.detail)return;
  const card=$(`<div class="card-paper" style="margin-top:14px">
    <div class="ai-tag"><span class="dot"></span> Tu portafolio</div>
    <h3 style="margin-top:8px">${esc(doc.doc_type)}</h3>
    <p class="muted t-sm" style="margin-top:6px">Tus ejercicios y retos, compilados en el documento que un cliente pagaría por recibir: tuyo, descargable en PDF, listo para tu portafolio o para enviar.</p>
    <div id="pdz" style="margin-top:12px;display:flex;flex-direction:column;gap:8px"></div></div>`);
  app.append(card);
  const zone=card.querySelector('#pdz');
  if(doc.exists){
    const v=$(`<button class="btn btn-paper">${I('doc','ic ic-s')} Ver mi documento</button>`);
    v.onclick=()=>nav('#/documento/'+slug); zone.append(v);
  }else if(doc.eligible){
    const g=$(`<button class="btn btn-paper">${I('doc','ic ic-s')} Compilar mi documento</button>`);
    g.onclick=async()=>{
      g.disabled=true;g.textContent='Compilando tu documento… (unos segundos)';
      const res=await fetch('/api/learn/project-doc/'+slug,{method:'POST'});
      const r=await res.json();
      if(!res.ok){g.disabled=false;g.textContent='Compilar mi documento';alert(r.detail||'No se pudo compilar.');return;}
      nav('#/documento/'+slug);
    };
    zone.append(g);
  }else{
    /* The gate is deliberate, not a tease. Fed one or two pieces the compiler
       does not produce a short document — it fills the vacuum by inventing
       (it once wrote a skills inventory for a learner whose only submission was
       the starter prompt). So say what it needs and why, and show the progress
       so it reads as a countdown rather than a locked door. */
    const have=doc.submissions||0, need=doc.needed||3;
    const pips=Array.from({length:need},(_,i)=>
      `<span style="width:22px;height:4px;border-radius:2px;background:${i<have?'var(--amber)':'rgba(255,255,255,.14)'}"></span>`).join('');
    zone.append($(`<div>
      <div class="row" style="gap:6px;align-items:center;margin-bottom:8px">${pips}
        <span class="faint" style="font-size:var(--fs-xs);margin-left:6px">${have} de ${need} trabajos</span></div>
      <p class="faint t-sm" style="margin:0">Con ${need} entregas tuyas ya hay material real para compilar.
      Con menos, el documento tendría que inventar — y este lo vas a mostrar.
      ${have===0?'Envía el ejercicio de cualquier lección para empezar.':`Te ${need-have===1?'falta 1':'faltan '+(need-have)}.`}</p></div>`));
  }
  // Companion narrative: the STAR case study about how the work was done.
  if(cs&&!cs.detail&&(cs.exists||cs.eligible)){
    const row=$(`<button class="btn btn-ghost btn-sm" style="width:100%">${cs.exists?'Ver mi caso de estudio (STAR) ›':'Generar caso de estudio (STAR)'}</button>`);
    row.onclick=async()=>{
      if(cs.exists)return nav('#/caso-view/'+slug);
      row.disabled=true;row.textContent='Redactando tu caso…';
      const res=await fetch('/api/learn/case-study/'+slug,{method:'POST'});
      if(res.ok)nav('#/caso-view/'+slug); else {row.disabled=false;row.textContent='Generar caso de estudio (STAR)';}
    };
    zone.append(row);
  }
}

async function openCapstone(id){
  const d=await api('/capstone/'+id); if(d.__unauth)return toLogin();
  if(d.detail){alert(d.detail);return;}
  app.innerHTML='';
  const back=$(`<div class="back">‹ Temario</div>`); back.onclick=()=>nav('#/curso/'+d.course_slug); app.append(back);
  app.append($(`<div><div class="eyebrow">Reto del módulo ${d.module_no}</div>
    <h2 style="margin-top:8px">${esc((d.title||'').replace(/^reto:?\s*/i,''))}</h2>
    <p class="muted t-sm" style="margin-top:6px">Un caso nuevo. Nada de teoría: demuestra que puedes aplicarlo.</p></div>`));
  app.append($(`<div class="card"><div class="microlabel" style="color:var(--amber)">El caso</div>
    <p class="t-base" style="margin-top:8px;white-space:pre-wrap">${esc(d.scenario)}</p></div>`));
  app.append($(`<div class="card ai-card"><div class="ai-tag"><span class="dot"></span> Tu entregable</div>
    <p class="t-base" style="margin-top:8px">${esc(d.deliverable)}</p></div>`));
  if(d.last){
    app.append($(`<div class="microlabel">Tu último intento</div>`));
    app.append(evalCard(d.last));
    const dz=defenseCard(d.last); if(dz)app.append(dz);
  }
  const form=$(`<div style="display:flex;flex-direction:column;gap:12px">
    <div><label>Tu solución</label><textarea id="cap" maxlength="8000" style="min-height:120px" placeholder="Escribe o pega tu solución completa"></textarea></div>
    <button class="btn btn-primary" id="send">${d.last?'Intentarlo de nuevo':'Enviar mi solución'}</button>
    <div id="cmsg" class="center muted t-sm"></div>
    <div id="cres" style="display:flex;flex-direction:column;gap:12px"></div></div>`);
  app.append(form);
  if(d.last_content)form.querySelector('#cap').value=d.last_content;
  attachDraft(form.querySelector('#cap'),'capstone',id);
  const doSubmitCap=async(predicted)=>{
    const content=form.querySelector('#cap').value.trim();
    const msg=form.querySelector('#cmsg'), btn=form.querySelector('#send');
    const zone=form.querySelector('#cres');
    zone.innerHTML=''; const rc=readingCard('Tu tutora está leyendo tu solución…'); zone.append(rc);
    const {res,data:r}=await postWithTimeout('/api/learn/submit-capstone',{capstone_id:id,content,predicted:predicted??null});
    if(!res||!res.ok){rc.remove();btn.classList.remove('hide');btn.disabled=false;msg.textContent=r.detail||'No pudimos evaluar, intenta de nuevo.';return;}
    const ta=form.querySelector('#cap'); ta.disabled=true;
    clearDraft('capstone',id);
    evalResult(zone, r.evaluation,
      ()=>{ta.disabled=false;ta.focus();zone.innerHTML='';
        msg.textContent='Mejora tu solución con el feedback y envíala de nuevo.';
        btn.classList.remove('hide');btn.disabled=false;btn.textContent='Enviar de nuevo';},
      ()=>nav('#/curso/'+d.course_slug),'Volver al temario ›');
  };
  // Same prediction beat as the exercise: a reto is a work product too, and the
  // two should not disagree about how self-assessment is asked for.
  form.querySelector('#send').onclick=()=>{
    const content=form.querySelector('#cap').value.trim();
    const msg=form.querySelector('#cmsg'), btn=form.querySelector('#send');
    if(content.length<50){msg.textContent='Desarrolla tu solución un poco más (mínimo 50 caracteres).';return;}
    msg.textContent=''; btn.classList.add('hide');
    const zone=form.querySelector('#cres'); zone.innerHTML='';
    zone.append(predictionBeat(doSubmitCap));
  };
}

/* ---------- lesson ---------- */
async function openLesson(id,step){
  const l=await api('/lesson/'+id); if(l.__unauth)return toLogin();
  // is_review comes ONLY from the server (completed = review). Forcing it
  // client-side made completions via prev/next navigation silently not count.
  STATE.lesson=l; STATE.answers={};
  // Deep links land on the exact step — a pending conversation is one tap away.
  if(step==='explica')renderExplain();
  else if(step==='quiz')renderQuiz();
  else if(step==='ejercicio')renderExercise();
  else renderVideo();
}
function lessonShell(inner,showNav){
  app.innerHTML=''; const l=STATE.lesson;
  const head=$(`<div class="lesson-head"><div class="back">‹ Temario</div><span class="microlabel">Lección ${l.position} de ${l.total}</span></div>`);
  head.querySelector('.back').onclick=()=>nav('#/curso/'+l.course_slug);
  app.append(head); app.append(inner);
  // Prev/next only on the lesson's entry screen: mid-flow (explain/quiz/
  // exercise) they invited wandering off and losing progress.
  if(showNav){
    const bar=$(`<div class="navbtns"><button id="np">‹ Anterior</button><button id="nn">Siguiente ›</button></div>`);
    const p=bar.querySelector('#np'), n=bar.querySelector('#nn');
    p.disabled=!l.prev_id; n.disabled=!l.next_id;
    p.onclick=()=>l.prev_id&&nav('#/leccion/'+l.prev_id);
    n.onclick=()=>l.next_id&&nav('#/leccion/'+l.next_id);
    app.append(bar);
  }
}
function renderVideo(){
  const l=STATE.lesson, pts=(l.key_points||[]).map(p=>`<li style="margin-bottom:7px">${esc(p)}</li>`).join('');
  const wrap=$(`<div style="display:flex;flex-direction:column;gap:14px">

       poster="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 1280'%3E%3Crect width='720' height='1280' fill='%23161310'/%3E%3Ccircle cx='360' cy='640' r='54' fill='none' stroke='%23c98a2b' stroke-width='4'/%3E%3Cpath d='M342 610l46 30-46 30z' fill='%23c98a2b'/%3E%3C/svg%3E"></video>`:`<div class="card muted">Video en producción — por ahora usa Resumen y Guía.</div>`}
    <div id="readpane" class="hide" style="display:flex;flex-direction:column;gap:12px">
      ${pts?`<div class="card"><div class="microlabel" style="color:var(--amber)">Puntos clave</div><ul style="margin:10px 0 0 18px;font-size:var(--fs-base)">${pts}</ul></div>`:''}
      <div class="card"><div class="microlabel">Lección completa</div><p class="t-base" style="margin-top:10px;white-space:pre-wrap">${esc(l.transcript||'—')}</p></div></div>
    <div id="guidepane" class="hide"><div class="written" id="writtenbody"></div><div id="diagrams"></div></div>
    <button class="btn btn-primary" id="toquiz">Continuar ${I('arrow','ic ic-s')}</button></div>`);
  const hasGuide=(l.written&&l.written.trim())||(l.diagrams&&l.diagrams.length);
  const tabs=$(`<div class="seg">
    <button id="tv">${I('play','ic ic-s')} Ver</button>
    <button id="tr">${I('book','ic ic-s')} Resumen</button>
    ${hasGuide?`<button id="tg">${I('tool','ic ic-s')} Guía</button>`:''}</div>`);
  (wrap.querySelector('#vid')||wrap.firstChild).after(tabs);
  lessonShell(wrap,true);
  const vid=wrap.querySelector('#vid'), read=wrap.querySelector('#readpane'), guide=wrap.querySelector('#guidepane');
  const tv=tabs.querySelector('#tv'),tr=tabs.querySelector('#tr'),tg=tabs.querySelector('#tg'); let built=false;
  const set=(m)=>{if(vid)vid.classList.toggle('hide',m!=='ver');read.classList.toggle('hide',m!=='leer');guide.classList.toggle('hide',m!=='guia');
    tv.classList.toggle('on',m==='ver');tr.classList.toggle('on',m==='leer');if(tg)tg.classList.toggle('on',m==='guia');
    if(m==='guia'&&!built){buildGuide(wrap,l);built=true;}};
  set(l.video_url?'ver':'leer');
  tv.onclick=()=>set('ver');tr.onclick=()=>set('leer');if(tg)tg.onclick=()=>set('guia');
  // Reviews go through explain too: it's retrieval practice, it keeps a pending
  // conversation reachable after completion, and it has a skip straight to the quiz.
  wrap.querySelector('#toquiz').onclick=()=>renderExplain();
}

/* ---------- evaluation helpers ---------- */
/* Predicting your own grade IS the metacognition this product claims to teach
   (docs/02: "the meta-skill of judging your own work"). It used to be a bare
   number box beside the send button and was used in 2 of 16 real submissions.
   So it is a beat instead: one tap between deciding to submit and the work
   leaving your hands, phrased as a judgement rather than a number. Shared by
   the exercise and the reto — two work products must not ask differently.
   Always skippable: the platform gates on doing, never on ceremony. */
const PREDICTIONS=[
  ['Le falta',            50, 'Sé que está incompleto'],
  ['Va bien',             70, 'Cumple, con huecos'],
  ['Está sólido',         85, 'Lo entregaría a un cliente'],
  ['Es mi mejor trabajo', 95, 'No sabría cómo mejorarlo'],
];
function predictionBeat(onPick){
  const beat=$(`<div class="card-spot">
    <div class="eyebrow">${I('target','ic ic-s')} Antes de verla, ¿cómo la ves tú?</div>
    <p class="faint t-sm" style="margin:6px 0 12px">Acertar no suma puntos. Saber juzgar tu propio trabajo sí es parte del oficio.</p>
    <div id="predopts" style="display:flex;flex-direction:column;gap:8px"></div>
    <button class="btn btn-ghost btn-sm" id="predskip" style="width:100%;margin-top:8px">Prefiero no adivinar</button></div>`);
  const opts=beat.querySelector('#predopts');
  PREDICTIONS.forEach(([label,value,hint])=>{
    const b=$(`<button class="btn btn-ghost" style="width:100%;text-align:left">
      <b>${label}</b><span class="faint" style="font-size:var(--fs-xs);display:block;font-weight:500">${hint}</span></button>`);
    b.onclick=()=>onPick(value); opts.append(b);
  });
  beat.querySelector('#predskip').onclick=()=>onPick(null);
  return beat;
}

const VERDICT={lo_tienes:'Lo tienes', casi:'Casi', todavia_no:'Todavía no'};
/* A comprehension check reports a state of understanding, not a grade: the
   explain step is diagnostic, and scoring it punished correct-but-generic
   explanations (a concept is generic by nature). Work products keep numbers. */
function verdictCard(ev){
  // Legacy explains (scored under the old numeric rubric) render here too, with
  // no badge — we never show that number again rather than invent a verdict.
  const v=ev.verdict, label=VERDICT[v];
  const missing=(ev.missing&&ev.missing.length)
    ?`<div class="note note-goal"><b>${I('target','ic ic-s')} ${v==='lo_tienes'?'Para redondearlo:':'Para que quede claro te falta:'}</b>
       <ul style="margin:6px 0 0 18px">${ev.missing.map(m=>`<li style="margin-bottom:4px">${esc(m)}</li>`).join('')}</ul></div>`:'';
  const card=$(`<div class="card" style="margin-top:4px">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="microlabel" style="color:var(--amber)">¿Quedó claro?${ev.attempt&&ev.attempt>1?` · intento ${ev.attempt}`:''}</div>
      ${label?`<div class="verdict ${v}">${label}</div>`:''}</div>
    <p class="t-base">${esc(ev.feedback||'')}</p>
    ${ev.misconception?`<div class="note note-warn">${I('alert','ic ic-s')} ${esc(ev.misconception)}</div>`:''}
    ${missing}
    <div id="rtz"></div></div>`);
  /* The third move. "casi"/"todavía no" used to leave exactly two options —
     retry with the same understanding, or skip — which is no choice at all for
     someone who did not follow the video. Asking for help is free: never
     evaluated, never counted, and it cannot lower anything. */
  if(v==='casi'||v==='todavia_no'){
    const zone=card.querySelector('#rtz');
    const btn=$(`<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:10px">${I('spark','ic ic-s')} Explícamelo de otra forma</button>`);
    btn.onclick=async()=>{
      btn.disabled=true; zone.querySelectorAll('.card-spot,.faint').forEach(e=>e.remove());
      const rc=readingCard('Tu tutora está buscando otra manera de explicártelo…');
      zone.append(rc);
      const {res,data:r}=await postWithTimeout('/api/learn/reteach',{node_id:STATE.lesson.id});
      rc.remove(); btn.disabled=false;
      if(!res||!res.ok){
        zone.append($(`<p class="faint t-sm" style="margin-top:8px">${esc((r&&r.detail)||'No pudimos prepararla, intenta de nuevo.')}</p>`));
        return;
      }
      const box=$(`<div class="card-spot" style="margin-top:10px">
        <div class="eyebrow">${I('spark','ic ic-s')} Otra forma de verlo</div>
        <div class="written" id="rtbody" style="margin-top:8px"></div>
        ${r.check?`<div class="note note-goal" style="margin-top:10px"><b>Para comprobar:</b> ${esc(r.check)}</div>`:''}</div>`);
      zone.append(box);
      renderMD(box.querySelector('#rtbody'), r.explanation);
      btn.textContent='Explícamelo otra vez, distinto';
    };
    zone.append(btn);
  }
  return card;
}
function evalCard(ev,animate){
  if(ev.verdict||ev.kind==='explain')return verdictCard(ev);
  /* THE NUMBER ON SCREEN IS THEIR NOTA — the best they have earned — never the
     attempt they happen to have just sent. A learner watched 79 become 50 become
     30 on the same work and stopped; the score was safe in the database the
     whole time, which helped nobody. A weaker attempt is now DIAGNOSTIC: we say
     what it would have scored and why, and the nota does not move. Retrying can
     only teach you something, never cost you something. */
  const mine=ev.final_score??ev.score;                 // this attempt
  const best=(ev.best_score!=null)?ev.best_score:mine; // what they keep
  const shown=(mine!=null&&best!=null)?Math.max(mine,best):(mine??best);
  const lower=(mine!=null&&best!=null&&mine<best);
  const cls=shown>=80?'hi':shown>=60?'mid':'lo';
  const D=ev.dimensions;
  const dimRow=(label,v,max)=>`<div class="dimrow">
    <span>${label}</span>
    <div class="prog"><i data-w="${Math.max(2,Math.round(v/max*100))}" style="width:${animate?0:Math.max(2,Math.round(v/max*100))}%"></i></div>
    <span>${v}/${max}</span></div>`;
  const dims=D?`<div style="margin:2px 0 10px">${dimRow('Aplicación',D.aplicacion,40)}${dimRow('Criterio',D.criterio,30)}${dimRow('Ejecución',D.ejecucion,30)}</div>`:'';
  const missing=(ev.missing&&ev.missing.length)
    ?`<div class="note note-goal"><b>${I('target','ic ic-s')} ${lower?'Lo que le falta a esta versión:':'Para llegar a 100 te falta:'}</b>
       <ul style="margin:6px 0 0 18px">${ev.missing.map(m=>`<li style="margin-bottom:4px">${esc(m)}</li>`).join('')}</ul></div>`:'';
  // A weaker attempt is framed as what it IS — a version that would have scored
  // less — instead of as a new, lower grade. The nota above it does not move.
  const diag=lower
    ?`<div class="note note-warn" style="margin-bottom:8px">${I('alert','ic ic-s')}
       <span><b>Tu nota sigue siendo ${best}.</b> Esta versión habría sacado ${mine};
       abajo te explico por qué, para que la siguiente suba y no para restarte.</span></div>`:'';
  const unchanged=ev.unchanged
    ?`<div class="note note-warn" style="margin-bottom:8px">${I('alert','ic ic-s')} Es la misma entrega de antes, así que mantiene su nota.
       Cambia lo que te señalé abajo y vuelve a enviarla.</div>`:'';
  const dimsLabel=lower
    ?`<div class="microlabel" style="margin:6px 0 2px">Cómo puntuaría esta versión</div>`:'';
  const gap=(ev.predicted!=null&&ev.score!=null)?ev.predicted-ev.score:null;
  const pred=gap!=null?`<p class="faint" style="font-size:var(--fs-xs);margin-top:8px">Tu predicción: ${ev.predicted} · Nota: ${ev.score}${Math.abs(gap)>=15?(gap>0?' — esta vez fuiste optimista; saber autoevaluarse también se entrena.':' — te subestimaste; tu trabajo vale más de lo que crees.'):' — bien calibrada.'}</p>`:'';
  // The defensa has its own card (retryable) — never duplicated here.
  const defended='';
  const card=$(`<div class="card" style="margin-top:4px">
    <div class="row" style="justify-content:space-between;align-items:flex-start;margin-bottom:8px">
      <div class="microlabel" style="color:var(--amber);padding-top:10px">${lower?'Tu nota':'Tu evaluación'}${ev.attempt&&ev.attempt>1?` · intento ${ev.attempt}`:''}</div>
      <div class="scorebig ${cls}" data-n="${shown??0}">${animate?0:(shown??'—')}</div></div>
    ${unchanged}${diag}
    ${dimsLabel}${dims}
    <p class="t-base">${esc(ev.feedback||'')}</p>
    ${ev.misconception?`<div class="note note-warn">${I('alert','ic ic-s')} ${esc(ev.misconception)}</div>`:''}
    ${missing}
    ${ev.improve&&!(ev.missing&&ev.missing.length)?`<div class="note note-goal">→ ${esc(ev.improve)}</div>`:''}
    ${defended}${pred}</div>`);
  if(animate)requestAnimationFrame(()=>animateEval(card));
  return card;
}
/* the reveal: bars fill in sequence, then the serif number counts up */
function animateEval(card){
  card.querySelectorAll('.prog i[data-w]').forEach((bar,i)=>{
    setTimeout(()=>{bar.style.width=bar.dataset.w+'%';},150+i*180);
  });
  const num=card.querySelector('.scorebig');
  if(!num)return;
  const target=parseInt(num.dataset.n,10)||0, t0=performance.now(), dur=850;
  const tick=(t)=>{const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    num.textContent=Math.round(target*e);
    if(p<1)requestAnimationFrame(tick);};
  requestAnimationFrame(tick);
}
/* The ownership probe: one question only the decision-maker can answer.
   Optional, rewarded (+10 max), and RETRYABLE without limit — every evaluation
   names what a +10 answer would add, and the best attempt is the one that
   counts, so defending again can only help. We reward appropriation; we never
   police AI use. */
function defenseCard(ev, onDone){
  if(!ev.defense_question)return null;
  const dz=$(`<div class="card-spot"></div>`);

  const askForm=(intro)=>{
    dz.innerHTML=`<div class="eyebrow">${I('mic','ic ic-s')} Conversa con tu tutora · suma hasta 10 pts</div>
      <p class="t-base" style="font-weight:600;margin-top:8px">${esc(ev.defense_question)}</p>
      <p class="faint" style="font-size:var(--fs-xs);margin-top:4px">${intro}</p>
      <textarea id="defans" maxlength="2000" style="margin-top:10px" placeholder="Porque..."></textarea>
      <button class="btn btn-primary btn-sm" id="defsend" style="margin-top:8px;width:100%">${I('send','ic ic-s')} Enviar mi respuesta</button>
      <div id="defmsg" class="faint t-sm" style="margin-top:6px"></div>`;
    // Read the latest answer at render time — a retry must never start blank.
    dz.querySelector('#defans').value=(ev.defense&&ev.defense.answer)||'';
    dz.querySelector('#defsend').onclick=send;
  };

  const showResult=(d,best,finalScore)=>{
    const cls=d.bonus>=7?'hi':d.bonus>=4?'mid':'lo';
    const missing=(d.missing&&d.missing.length)
      ? `<div class="note note-goal"><b>${I('target','ic ic-s')} Para llegar a los 10 puntos:</b>
          <ul style="margin:6px 0 0 18px">${d.missing.map(m=>`<li style="margin-bottom:4px">${esc(m)}</li>`).join('')}</ul></div>` : '';
    const kept=(best>d.bonus)
      ? `<div class="note note-goal">Se mantiene tu mejor respuesta: <b>+${best}</b> — nunca pierdes puntos por volver a intentarlo.</div>` : '';
    dz.innerHTML=`<div class="eyebrow">${I('mic','ic ic-s')} ${best>=10?'¡Llegaste a los 10 puntos!':'Tu tutora te respondió'}</div>
      <div class="row" style="justify-content:space-between;align-items:flex-start;margin-top:8px">
        <p class="t-base" style="flex:1">${esc(d.comment||'')}</p>
        <div class="scorepill ${cls}" style="margin-left:10px">+${d.bonus}</div></div>
      ${missing}${kept}
      <p class="microlabel" style="margin-top:10px">Nota final: ${finalScore}</p>`;
    if(best<10){
      const again=$(`<button class="btn btn-primary btn-sm" style="width:100%;margin-top:12px">${I('send','ic ic-s')} Responder de nuevo</button>`);
      again.onclick=()=>askForm('Suma lo que te faltó y respóndele otra vez. Puedes conversar las veces que quieras hasta llegar a los 10.');
      dz.append(again);
      dz.append($(`<p class="faint center" style="font-size:var(--fs-xs);margin-top:6px">Intentos ilimitados · siempre se queda tu mejor respuesta</p>`));
    }
  };

  async function send(){
    const answer=dz.querySelector('#defans').value.trim();
    const btn=dz.querySelector('#defsend'), msg=dz.querySelector('#defmsg');
    if(answer.length<10){msg.textContent='Desarrolla tu respuesta un poco más.';return;}
    btn.disabled=true;btn.textContent='Evaluando tu defensa…';
    const res=await fetch('/api/learn/defend',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({submission_id:ev.id,answer})});
    const r=await res.json();
    if(!res.ok){btn.disabled=false;btn.innerHTML=`${I('send','ic ic-s')} Enviar mi respuesta`;msg.textContent=r.detail||'No se pudo evaluar, intenta de nuevo.';return;}
    ev.defense=r.defense; ev.defense_best=r.best; ev.final_score=r.final_score;
    showResult(r.defense, r.best, r.final_score);
    // The headline score must reflect the bonus the learner just earned.
    // Same rule as evalCard: the headline is their nota, so it can rise from a
    // conversation bonus but never fall because they defended an older attempt.
    const big=dz.parentElement&&dz.parentElement.querySelector('.scorebig');
    if(big){
      const cur=parseInt(big.textContent,10);
      const n=Math.max(r.final_score??0, r.best_score??0, isNaN(cur)?0:cur);
      big.textContent=n;
      big.className='scorebig '+(n>=80?'hi':n>=60?'mid':'lo');}
    if(onDone)onDone(r);
  }

  if(ev.defense)showResult(ev.defense, ev.defense_best??ev.defense.bonus, ev.final_score??'—');
  else askForm('Responde con tus palabras: solo quien tomó las decisiones contesta bien esto. Si usaste IA, contar qué le cambiaste y por qué también suma. Puedes responder las veces que quieras — se queda tu mejor respuesta.');
  return dz;
}
/* Feedback is an invitation, not a verdict: below 90 the primary action is to
   improve the answer; the path forward is always available but never pushy. */
function evalResult(zone, ev, retryFn, nextFn, nextLabel){
  zone.innerHTML=''; zone.append(evalCard(ev,true));
  const dz=defenseCard(ev); if(dz)zone.append(dz);
  const good=ev.verdict?ev.verdict==='lo_tienes':(ev.score??0)>=90;
  const retry=$(`<button class="btn ${good?'btn-ghost':'btn-primary'}">${I('pen','ic ic-s')} ${ev.verdict?'Explicarlo de nuevo':'Mejorar mi respuesta'}</button>`);
  retry.onclick=retryFn;
  const next=$(`<button class="btn ${good?'btn-primary':'btn-ghost'}">${nextLabel}</button>`);
  next.onclick=nextFn;
  if(good){zone.append(next);zone.append(retry);}else{zone.append(retry);zone.append(next);}
}

/* ---------- explain it back (Feynman) ---------- */
function renderExplain(){
  const l=STATE.lesson;
  const wrap=$(`<div style="display:flex;flex-direction:column;gap:14px">
    <div><div class="eyebrow">Antes del quiz</div>
    <h2 style="margin-top:8px">Explícalo en tus palabras</h2>
    ${l.explain_prompt
      ?`<div class="card" style="margin-top:10px;border-color:rgba(240,164,60,.35)"><p class="t-md" style="font-weight:600">${esc(l.explain_prompt)}</p></div>
        <p class="muted t-sm" style="margin-top:8px">Respóndelo como se lo contarías a un amigo, con tus palabras y tu ejemplo.</p>`
      :`<p class="muted t-sm" style="margin-top:6px">Como si se lo contaras a un amigo que no vio el video. Si puedes explicarlo, lo entendiste de verdad.</p>`}</div>
    <textarea id="expl" maxlength="5000" placeholder="Lo que entendí es que..."></textarea>
    <p class="faint" style="font-size:var(--fs-xs)">Esto no lleva nota: es para ver si el concepto te quedó claro. Explícalo en abstracto o con un ejemplo, como prefieras.</p>
    <button class="btn btn-primary" id="send">Enviar mi explicación</button>
    <button class="btn btn-ghost" id="skip">Ir directo al quiz ›</button>
    <div id="emsg" class="center muted t-sm"></div>
    <div id="eres" style="display:flex;flex-direction:column;gap:12px"></div></div>`);
  lessonShell(wrap);
  attachDraft(wrap.querySelector('#expl'),'explain',l.id);
  wrap.querySelector('#skip').onclick=renderQuiz;
  if(l.last_explain){
    wrap.querySelector('#expl').value=l.last_explain.content;
    wrap.querySelector('#send').textContent='Enviar de nuevo';
    const zone=wrap.querySelector('#eres');
    zone.append($(`<div class="microlabel">Tu entrega anterior</div>`));
    zone.append(evalCard(l.last_explain.evaluation));
    const dz=defenseCard(l.last_explain.evaluation); if(dz)zone.append(dz);
  }
  wrap.querySelector('#send').onclick=async()=>{
    const content=wrap.querySelector('#expl').value.trim();
    const msg=wrap.querySelector('#emsg'), btn=wrap.querySelector('#send');
    if(content.length<20){msg.textContent='Escribe al menos un par de frases.';return;}
    msg.textContent='';
    const zone=wrap.querySelector('#eres');
    btn.classList.add('hide');wrap.querySelector('#skip').classList.add('hide');
    zone.innerHTML=''; const rc=readingCard('Tu tutora está leyendo tu explicación…'); zone.append(rc);
    const {res,data:r}=await postWithTimeout('/api/learn/submit',{node_id:l.id,kind:'explain',content});
    if(!res||!res.ok){rc.remove();btn.classList.remove('hide');wrap.querySelector('#skip').classList.remove('hide');btn.disabled=false;msg.textContent=r.detail||'No pudimos evaluar, intenta de nuevo.';return;}
    const ta=wrap.querySelector('#expl'); ta.disabled=true;
    clearDraft('explain',l.id);
    evalResult(zone, r.evaluation,
      ()=>{ta.disabled=false;ta.focus();zone.innerHTML='';
        msg.textContent='Ajusta tu respuesta con el feedback en mente y envíala de nuevo.';
        btn.classList.remove('hide');btn.disabled=false;btn.textContent='Enviar de nuevo';},
      renderQuiz,'Continuar al quiz ›');
  };
}
function buildGuide(wrap,l){
  const body=wrap.querySelector('#writtenbody');
  if(l.written) renderMD(body, l.written);
  const dc=wrap.querySelector('#diagrams');
  (l.diagrams||[]).forEach(d=>{const box=$(`<div><div class="diagram-title">${esc(d.title||'')}</div><div class="diagram"><pre class="mermaid">${esc(d.mermaid||'')}</pre></div></div>`);
    dc.append(box); if(window.renderMermaid)window.renderMermaid(box.querySelector('.mermaid'));});
}
function renderQuiz(){
  const l=STATE.lesson;
  const wrap=$(`<div style="display:flex;flex-direction:column;gap:16px"><div class="eyebrow">Quiz · ${l.quiz.length} preguntas</div></div>`);
  l.quiz.forEach((q,qi)=>{
    const block=$(`<div class="qblock"><h4>${qi+1}. ${esc(q.q)}</h4></div>`);
    q.options.forEach((opt,oi)=>{
      const b=$(`<button class="opt"><span class="key">${String.fromCharCode(65+oi)}</span><span>${esc(opt)}</span></button>`);
      b.onclick=()=>{if(block.dataset.done)return; STATE.answers[qi]=oi; block.dataset.done='1';
        [...block.querySelectorAll('.opt')].forEach((o,k)=>{if(k===q.answer)o.classList.add('correct');else if(k===oi)o.classList.add('wrong');});
        block.append($(`<div class="explain">${esc(q.explain||'')}</div>`));
        if(Object.keys(STATE.answers).length===l.quiz.length)wrap.querySelector('#toex').classList.remove('hide');};
      block.append(b);
    });
    wrap.append(block);
  });
  const next=$(`<button class="btn btn-primary hide" id="toex">Ir al ejercicio ${I('arrow','ic ic-s')}</button>`); next.onclick=renderExercise; wrap.append(next);

function renderExercise(){
  const l=STATE.lesson, ex=l.exercise||{};
  const wrap=$(`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="ai-tag"><span class="dot"></span> Tu ejercicio de hoy</div><h2>${esc(l.title)}</h2>
    <div class="card"><p class="t-base">${esc(ex.instruction||'')}</p></div>
    ${ex.starting_point?`<div class="card ai-card"><div class="ai-tag"><span class="dot"></span> Pega esto en ChatGPT o Claude</div><div class="prompt">${esc(ex.starting_point)}</div><button class="copybtn" id="cp">${I('copy','ic ic-s')} Copiar prompt</button></div>`:''}
    ${STATE.me&&STATE.me.project_name
      ?`<div class="note note-goal">${I('target','ic ic-s')} <span>Tu proyecto: <b>${esc(STATE.me.project_name)}</b> — tu tutora evalúa contra este contexto. Haz el ejercicio sobre él.</span></div>`
      /* Without a declared project the exercise text still says "elige tu
         proyecto real", which is per-course wording from before the project
         moved to the learner (docs/09). Point them at the one place it lives. */
      :`<div class="note note-warn">${I('target','ic ic-s')} <span>Aún no definiste tu proyecto. <b>Aplicación vale 40 de 100 puntos</b> y mide qué tan anclado está esto en un proyecto tuyo — <u id="godef">defínelo en un minuto</u>.</span></div>`}
    <div><label>Pega aquí lo que hiciste</label>
    <p class="faint" style="font-size:var(--fs-xs);margin:-2px 0 8px">Usar IA está perfecto — es parte del oficio. Suma puntos contar qué le cambiaste a su respuesta y por qué.</p>
    <textarea id="work" maxlength="5000" placeholder="Tu brief, tus copys, tu plan... lo que produjo el ejercicio. Recibirás feedback al instante."></textarea></div>
    <button class="btn btn-primary" id="send">Enviar mi trabajo</button>
    <button class="btn btn-ghost" id="later">Terminar sin enviar</button>
    <div id="xmsg" class="center muted t-sm"></div>
    <div id="xres" style="display:flex;flex-direction:column;gap:12px"></div></div>`);
  lessonShell(wrap);
  attachDraft(wrap.querySelector('#work'),'exercise',l.id);
  const gd=wrap.querySelector('#godef');
  if(gd){gd.style.cursor='pointer'; gd.onclick=()=>nav('#/perfil');}
  const cp=wrap.querySelector('#cp'); if(cp)cp.onclick=()=>{navigator.clipboard.writeText(ex.starting_point);cp.textContent='✓ Copiado';};
  wrap.querySelector('#later').onclick=finish;
  if(l.last_exercise){
    wrap.querySelector('#work').value=l.last_exercise.content;
    wrap.querySelector('#send').textContent='Enviar de nuevo';
    const zone=wrap.querySelector('#xres');
    zone.append($(`<div class="microlabel">Tu entrega anterior</div>`));
    zone.append(evalCard(l.last_exercise.evaluation));
    const dz=defenseCard(l.last_exercise.evaluation); if(dz)zone.append(dz);
  }
  const doSubmit=async(predicted)=>{
    const content=wrap.querySelector('#work').value.trim();
    const msg=wrap.querySelector('#xmsg'), btn=wrap.querySelector('#send');
    const zone=wrap.querySelector('#xres');
    zone.innerHTML=''; const rc=readingCard('Tu tutora está leyendo tu trabajo…'); zone.append(rc);
    const {res,data:r}=await postWithTimeout('/api/learn/submit',
      {node_id:l.id,kind:'exercise',content,predicted:predicted??null});
    if(!res||!res.ok){rc.remove();btn.classList.remove('hide');wrap.querySelector('#later').classList.remove('hide');btn.disabled=false;msg.textContent=r.detail||'No pudimos evaluar, intenta de nuevo.';return;}
    const ta=wrap.querySelector('#work'); ta.disabled=true;
    clearDraft('exercise',l.id);   // it is stored server-side now
    evalResult(zone, r.evaluation,
      ()=>{ta.disabled=false;ta.focus();zone.innerHTML='';
        msg.textContent='Mejora tu entrega con el feedback y envíala de nuevo.';
        btn.classList.remove('hide');btn.disabled=false;btn.textContent='Enviar de nuevo';},
      finish,'Completar lección ✓');
  };
  wrap.querySelector('#send').onclick=()=>{
    const content=wrap.querySelector('#work').value.trim();
    const msg=wrap.querySelector('#xmsg'), btn=wrap.querySelector('#send');
    if(content.length<20){msg.textContent='Pega tu trabajo completo, no solo una línea.';return;}
    msg.textContent='';
    btn.classList.add('hide'); wrap.querySelector('#later').classList.add('hide');
    const zone=wrap.querySelector('#xres'); zone.innerHTML='';
    zone.append(predictionBeat(doSubmit));
  };
}
async function finish(){
  const l=STATE.lesson, correct=l.quiz.reduce((n,q,i)=>n+(STATE.answers[i]===q.answer?1:0),0);
  const score=l.quiz.length?correct/l.quiz.length:1;
  // Deep-linked past the quiz (e.g. from a pending conversation in Hoy): there
  // is no quiz result from this session, so never record a phantom 0 — either
  // nothing to add (already completed) or send them through the quiz first.
  if(l.quiz.length && !Object.keys(STATE.answers).length){
    if(l.is_review){ nav('#/curso/'+l.course_slug); return; }
    return renderQuiz();
  }
  let r;
  try{
    r=await api('/complete',{method:'POST',body:JSON.stringify({node_id:l.id,quiz_score:score,is_review:!!l.is_review})});
    if(!r||r.ok!==true)throw 0;
  }catch(e){
    // A dropped request must never swallow a completion silently.
    app.innerHTML='';
    app.append($(`<div class="celebrate"><h2 style="margin-top:30px">No pudimos guardar tu avance</h2>
      <p class="muted t-sm">Revisa tu conexión — tu lección no se pierde, solo falta registrarla.</p></div>`));
    const retry=$(`<button class="btn btn-primary" style="margin-top:18px">Reintentar</button>`);
    retry.onclick=finish; app.append(retry);
    return;
  }
  app.innerHTML='';
  app.append($(`<div class="celebrate"><div class="medal">${I(l.is_review?'redo':'spark','ic')}</div>
    <h2 style="font-size:30px;margin-top:18px">${l.is_review?'Repaso listo':'Lección '+l.position+' completada'}</h2>
    <p class="muted">${correct} de ${l.quiz.length} en el quiz.</p>
    <div class="bigstreak">${r.streak}</div><div class="microlabel">días seguidos</div></div>`));
  const c=$(`<button class="btn btn-primary" style="margin-top:24px">${l.next_id?'Siguiente lección ›':'Volver al temario'}</button>`);
  c.onclick=()=>l.next_id?nav('#/leccion/'+l.next_id):nav('#/curso/'+l.course_slug); app.append(c);
  const o=$(`<button class="btn btn-ghost" style="margin-top:10px">Ver el temario</button>`); o.onclick=()=>nav('#/curso/'+l.course_slug); app.append(o);
}

/* ---------- portafolio: the product's endgame, promoted to the nav ---------- */
async function viewPortfolio(){
  const pf=await api('/portfolio'); if(pf.__unauth)return toLogin();
  app.innerHTML='';
  app.append($(`<div class="topbar"><div class="brandrow"><div class="brandmark"></div><div class="brandname">Portafolio<small>Tu trabajo, tu evidencia</small></div></div></div>`));
  const items=pf.items||[];
  if(!items.length){
    app.append($(`<div class="card-paper" style="margin-top:6px"><h3>Todavía no hay piezas aquí</h3>
      <p class="muted t-sm" style="margin-top:8px">Cada ejercicio que envías se vuelve una sección de tu documento profesional. Empieza una lección y tu portafolio se construye solo.</p></div>`));
    const b=$(`<button class="btn btn-primary" style="margin-top:8px">Ir a mis cursos ${I('arrow','ic ic-s')}</button>`);
    b.onclick=()=>nav('#/cursos'); app.append(b);
    return;
  }
  // Group by course; the deliverables lead, the raw work follows.
  const byCourse={};
  items.forEach(it=>{const k=it.course_slug||'otros';(byCourse[k]=byCourse[k]||{title:it.course_title||'Otros',items:[]}).items.push(it);});
  const slugs=Object.keys(byCourse);
  const statuses=await Promise.all(slugs.map(s=>s==='otros'?null:api('/project-doc/'+s)));
  slugs.forEach((slug,i)=>{
    const g=byCourse[slug], st=statuses[i];
    app.append($(`<div class="modhead" style="margin-top:18px">${esc(g.title)}</div>`));
    if(st&&!st.detail){
      const zone=$(`<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px"></div>`);
      if(st.exists){
        const v=$(`<button class="btn btn-paper">${I('doc','ic ic-s')} ${esc(st.doc_type)}</button>`);
        v.onclick=()=>nav('#/documento/'+slug); zone.append(v);
      }else if(st.eligible){
        const gbtn=$(`<button class="btn btn-paper">${I('doc','ic ic-s')} Compilar mi ${esc(st.doc_type)}</button>`);
        gbtn.onclick=async()=>{gbtn.disabled=true;gbtn.textContent='Compilando… (unos segundos)';
          const res=await fetch('/api/learn/project-doc/'+slug,{method:'POST'});
          if(res.ok)nav('#/documento/'+slug); else {gbtn.disabled=false;gbtn.textContent='Compilar mi documento';}};
        zone.append(gbtn);
      }else{
        zone.append($(`<p class="faint t-sm">${esc(st.doc_type)}: se desbloquea con ${st.needed} trabajos · llevas ${st.submissions}.</p>`));
      }
      app.append(zone);
    }
    g.items.forEach(it=>{
      const cls=it.score>=80?'hi':it.score>=60?'mid':'lo';
      const KIND={explain:'Explicación',exercise:'Ejercicio',capstone:'Reto de módulo'};
      const mark=it.verdict?`<div class="vchip ${it.verdict}">${VERDICT[it.verdict]||''}</div>`
        :(it.score!=null?`<div class="scorepill ${cls}">${it.score}</div>`:'');
      const row=$(`<div class="pf-row">
        <div class="row" style="justify-content:space-between;gap:10px">
          <div style="flex:1;min-width:0"><div style="font-size:var(--fs-sm);font-weight:700;line-height:1.3">${esc(it.title||'')}</div>
          <div style="font-size:var(--fs-xs);color:var(--faint);margin-top:2px">${KIND[it.kind]||it.kind} · ${it.created_at}</div></div>
          ${mark}</div>
        <div class="fb">${esc(it.feedback||'')}</div></div>`);
      row.onclick=()=>row.classList.toggle('open');
      app.append(row);
    });
  });
}

/* ---------- profile ---------- */

  const d=await api('/profile'); if(d.__unauth)return toLogin();
  app.innerHTML='';
  app.append($(`<div class="topbar"><div class="brandrow"><div class="brandmark"></div><div class="brandname">Perfil</div></div>${flameChip(d.streak)}</div>`));
  app.append($(`<div class="card" style="text-align:center;padding:24px">
    <div style="width:64px;height:64px;border-radius:99px;margin:0 auto 12px;background:linear-gradient(150deg,var(--amber-hi),var(--amber-deep));display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:26px;font-weight:700;color:var(--amber-ink)">${esc((d.name||'?')[0].toUpperCase())}</div>
    <h2 style="font-size:var(--fs-xl)">${esc(d.name)}</h2><p class="muted t-sm">${esc(d.email)}</p></div>`));

    <div class="card" style="flex:1;text-align:center"><div class="bigstreak" style="font-size:34px;margin:0">${d.streak}</div><div class="microlabel">días seguidos</div></div>
    <div class="card" style="flex:1;text-align:center"><div class="bigstreak" style="font-size:34px;margin:0">${d.lessons_done}</div><div class="microlabel">lecciones hechas</div></div></div>`));
  // The transversal project: learner-level, editable here (docs/09).
  const pc=$(`<div class="card" style="margin-top:6px">
    <div class="row" style="gap:10px;color:var(--amber)">${I('target')}<b class="t-md" style="color:var(--text)">Tu proyecto</b></div>
    <p class="muted t-sm" style="margin:8px 0 12px">El proyecto real sobre el que trabajan todos tus ejercicios. Tu tutora evalúa contra este contexto.</p>
    <div style="display:flex;flex-direction:column;gap:10px">
    <div><label>Proyecto o marca</label><input id="ppn" maxlength="120" value="${esc(d.project_name)}" placeholder="Tu negocio, o una marca donde quieres trabajar"></div>
    <div><label>De qué se trata</label><input id="ppd" maxlength="500" value="${esc(d.project_desc)}" placeholder="Una línea de contexto"></div>
    <div><label>Tu meta</label><input id="ppg" maxlength="200" value="${esc(d.goal)}" placeholder="Conseguir trabajo, vender más..."></div>
    <button class="btn btn-ghost" id="psave">Guardar</button>
    <div id="pmsg" class="center muted t-sm"></div></div></div>`);
  pc.querySelector('#psave').onclick=async(e)=>{
    const b={project_name:pc.querySelector('#ppn').value.trim(),
             project_desc:pc.querySelector('#ppd').value.trim(),
             goal:pc.querySelector('#ppg').value.trim()};
    const r=await api('/profile',{method:'POST',body:JSON.stringify(b)});
    pc.querySelector('#pmsg').textContent=r&&r.ok?'Guardado ✓':'No se pudo guardar, intenta de nuevo.';
    if(r&&r.ok)Object.assign(STATE.me||{},b);
  };
  app.append(pc);
  if(d.courses.length){
    app.append($(`<div class="microlabel" style="margin-top:6px">Tu progreso</div>`));
    d.courses.forEach(c=>{const pct=Math.round(c.done/c.total*100);
      app.append($(`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span style="font-weight:700;font-size:var(--fs-base)">${esc(c.title)}</span><span class="muted t-sm">${c.done}/${c.total}</span></div><div class="prog"><i style="width:${pct}%"></i></div></div>`));});
  }
  /* A real link to the real page, opened in a new tab. It used to be an in-app
     re-render of a copy of the landing; there is one landing now and it has an
     address. `?publica=1` is what stops the server bouncing a signed-in visitor
     straight back into the app. */
  app.append($(`<a class="btn btn-ghost" style="margin-top:8px" href="/?publica=1"
    target="_blank" rel="noopener">Ver la portada pública</a>`));
  const how=$(`<button class="btn btn-ghost" style="margin-top:8px">¿Cómo funciona Rumbo?</button>`);
  how.onclick=()=>nav('#/como-funciona'); app.append(how);
  const out=$(`<button class="btn btn-ghost" style="margin-top:2px">Salir</button>`);
  out.onclick=async()=>{await api('/logout',{method:'POST'});location.href='/aprende';}; app.append(out);
}

/* ---------- keyboard: divs that behave like buttons must act like them -------
   This SPA builds rows, cards, clusters and the paper mock as <div> + onclick.
   That is fine for a thumb and invisible to a keyboard or a switch: no tab stop,
   no Enter, and a screen reader announcing nothing at all. It affects the temario
   row, the catalog card, the cluster header, every quiz option and the document
   mock on the landing — which is to say most of the product.

   One observer stamps the contract on anything interactive as it enters the DOM,
   so the ~40 construction sites stay untouched and every screen written after
   this one inherits it for free. The click handler is read at press time, not at
   stamp time, because rows get their onclick assigned after they are appended. */
const KEYABLE='.clickable,.back,.cluster,.opt,.pf-row,.req-row.ready,.course-card';
function stamp(el){
  if(!el||el.nodeType!==1||el.dataset.keyed||el.tagName==='BUTTON'||el.tagName==='A')return;
  el.dataset.keyed='1';
  el.setAttribute('role','button');
  el.setAttribute('tabindex','0');
}
function makeKeyable(root){
  if(!root||root.nodeType!==1)return;
  if(root.matches&&root.matches(KEYABLE))stamp(root);
  if(root.querySelectorAll)root.querySelectorAll(KEYABLE).forEach(stamp);
}
/* Second pass, debounced to the end of the task. A class list cannot be the only
   signal here: most of this codebase appends the node first and assigns .onclick
   afterwards, so at insertion time an element that is about to become a button
   looks like a div. The catalog card was exactly this — fourteen of them on the
   first screen a learner sees, none reachable. Anything inside #app that ends up
   with a click handler becomes operable, whatever it happens to be called. */
let sweepTimer=null;
function sweepKeyable(){
  clearTimeout(sweepTimer);
  sweepTimer=setTimeout(()=>{
    const root=document.getElementById('app');
    if(root)root.querySelectorAll('*').forEach(el=>{ if(typeof el.onclick==='function')stamp(el); });
  },0);
}
/* Guarded because the three DOM-shim checks (docs/07's stand-in for a test
   runner) execute this file's script block in a bare VM with no MutationObserver
   and no document.body. Weakening the checks to accommodate a11y wiring would be
   the wrong trade; the wiring simply no-ops where there is no DOM. */
if(typeof MutationObserver!=='undefined'&&document.body){
  new MutationObserver(ms=>{
    for(const m of ms) m.addedNodes.forEach(makeKeyable);
    sweepKeyable();
  }).observe(document.body,{childList:true,subtree:true});
  document.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' '&&e.key!=='Spacebar')return;
    const el=e.target;
    if(!el||!el.dataset||el.dataset.keyed!=='1')return;
    if(typeof el.onclick!=='function')return;
    e.preventDefault();   // Space must not scroll the page out from under them
    el.click();
  });
}

boot();
